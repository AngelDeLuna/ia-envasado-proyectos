<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IA Envasado Proyectos</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <h1 class="topbar__title">IA Envasado Proyectos</h1>
    <div class="topbar__logo">
      <img src="images/Logo.png" alt="Logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';">
      <span style="display:none;">Logo</span>
    </div>
  </header>
  <div class="accent-line"></div>

  <div class="toolbar">
    <span class="toolbar__label">Vista de todos los proyectos</span>
    <a class="sort-btn toolbar-link" href="nuevo-proyecto.html">+ Registrar proyecto</a>
    <button id="reloadBtn" class="sort-btn" type="button" title="Volver a consultar MySQL">
      <span>Recargar</span>
    </button>
    <button id="creatorSortBtn" class="sort-btn" type="button">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 6h18M7 12h10M10 18h4"/></svg>
      <span class="creator-sort-btn__text">Ordenar por creador</span>
    </button>
    <button id="sortBtn" class="sort-btn" type="button">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
      <span class="sort-btn__text">Ordenar por progreso</span>
    </button>
  </div>

  <p id="diag" class="diag"></p>
  <div class="legend">
    <span class="legend__item"><span class="legend__dot" style="background:var(--stage-ideas)"></span>Ideas</span>
    <span class="legend__item"><span class="legend__dot" style="background:var(--stage-progreso)"></span>En progreso</span>
    <span class="legend__item"><span class="legend__dot" style="background:var(--stage-terminado)"></span>Terminado</span>
  </div>
  <main id="board" class="board"><p class="state-msg">Cargando proyectos…</p></main>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
